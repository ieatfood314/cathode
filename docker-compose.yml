services:
  cathode:
    build: ./server
    image: cathode-server:latest
    container_name: cathode
    restart: unless-stopped
    ports:
      - "${CATHODE_PORT:-8000}:8000"
    environment:
      CATHODE_DATA_DIR: /data
      CATHODE_MEDIA_DIR: /media
      CATHODE_DB_PATH: /data/cathode.db
      CATHODE_ARCHIVE_PATH: /data/archive.txt
      CATHODE_POLL_MODE: ${CATHODE_POLL_MODE:-periodic}
      CATHODE_POLL_INTERVAL_MINUTES: ${CATHODE_POLL_INTERVAL_MINUTES:-30}
      CATHODE_MAX_RESOLUTION: ${CATHODE_MAX_RESOLUTION:-1080}
      CATHODE_SPONSORBLOCK_REMOVE: ${CATHODE_SPONSORBLOCK_REMOVE:-sponsor,selfpromo,interaction}
      CATHODE_SPONSORBLOCK_MARK: ${CATHODE_SPONSORBLOCK_MARK:-all}
      CATHODE_KEEP_DAYS: ${CATHODE_KEEP_DAYS:-0}
    volumes:
      - "${CATHODE_DATA_DIR:-./data}:/data"
      - "${CATHODE_MEDIA_DIR:-./media}:/media"
