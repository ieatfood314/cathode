name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt pytest httpx
      - run: sudo mkdir -p /data /media && sudo chmod 777 /data /media
      - run: PYTHONPATH=server pytest server/tests -q

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - run: cd android && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ruminate-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  android-release:
    # Every push to main feeds a rolling release tagged `apk` (Obtainium
    # tracks it). Skipped silently if the signing secret isn't configured
    # (e.g. forks) — tests and the debug APK still run.
    if: github.event_name != 'pull_request'
    needs: server-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Decode keystore
        run: |
          echo "${{ secrets.RUMINATE_KEYSTORE_B64 }}" | head -c 1 | grep -q . || echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
          echo "${{ secrets.RUMINATE_KEYSTORE_B64 }}" | base64 -d > "$GITHUB_WORKSPACE/ruminate-release.jks" || true
      - name: Compute build number
        if: env.SKIP_RELEASE != 'true'
        run: echo "RUMINATE_VERSION_CODE=$(( 1000 + ${{ github.run_number }} ))" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: env.SKIP_RELEASE != 'true'
        env:
          RUMINATE_KEYSTORE_PATH: ${{ github.workspace }}/ruminate-release.jks
          RUMINATE_KEYSTORE_PASSWORD: ${{ secrets.RUMINATE_KEYSTORE_PASSWORD }}
          RUMINATE_KEY_ALIAS: ${{ secrets.RUMINATE_KEY_ALIAS }}
          RUMINATE_KEY_PASSWORD: ${{ secrets.RUMINATE_KEY_PASSWORD }}
        run: cd android && gradle assembleRelease --no-daemon
      - name: Publish to rolling `apk` release
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create apk android/app/build/outputs/apk/release/app-release.apk \
            --target ${{ github.sha }} \
            --title "Ruminate APK (auto)" \
            --notes "Auto-built from main at ${{ github.sha }}" \
          || true
          gh release upload apk android/app/build/outputs/apk/release/app-release.apk --clobber
          gh release edit apk \
            --title "Ruminate APK (auto)" \
            --notes "Auto-built from main at [${GITHUB_SHA::7}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}). Install with Obtainium (add source ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}) or grab this APK directly."
