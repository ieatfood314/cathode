name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt pytest httpx
      - run: sudo mkdir -p /data /media && sudo chmod 777 /data /media
      - run: PYTHONPATH=server pytest server/tests -q

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - run: cd android && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cathode-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  android-release:
    # Every push to main publishes a versioned release (v<name>.<code>) whose
    # tag matches the APK's versionName, so Obtainium can tell when it's out
    # of date. Skipped silently if the signing secret isn't configured
    # (e.g. forks) — tests and the debug APK still run.
    if: github.event_name != 'pull_request'
    needs: server-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Decode keystore
        run: |
          echo "${{ secrets.CATHODE_KEYSTORE_B64 }}" | head -c 1 | grep -q . || echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
          echo "${{ secrets.CATHODE_KEYSTORE_B64 }}" | base64 -d > "$GITHUB_WORKSPACE/cathode-release.jks" || true
      - name: Compute build number
        if: env.SKIP_RELEASE != 'true'
        run: |
          code=$(( 1000 + ${{ github.run_number }} ))
          base=$(sed -n 's/.*CATHODE_VERSION_NAME") ?: "\([0-9.]*\)".*/\1/p' android/app/build.gradle.kts)
          echo "CATHODE_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "CATHODE_VERSION_NAME=$base.$code" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: env.SKIP_RELEASE != 'true'
        env:
          CATHODE_KEYSTORE_PATH: ${{ github.workspace }}/cathode-release.jks
          CATHODE_KEYSTORE_PASSWORD: ${{ secrets.CATHODE_KEYSTORE_PASSWORD }}
          CATHODE_KEY_ALIAS: ${{ secrets.CATHODE_KEY_ALIAS }}
          CATHODE_KEY_PASSWORD: ${{ secrets.CATHODE_KEY_PASSWORD }}
        run: cd android && gradle assembleRelease --no-daemon
      - name: Publish release
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$CATHODE_VERSION_NAME"
          apk="cathode-$CATHODE_VERSION_NAME.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$tag" "$apk" \
            --target ${{ github.sha }} \
            --title "Cathode $CATHODE_VERSION_NAME" \
            --notes "Auto-built from main at [${GITHUB_SHA::7}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}). Install with Obtainium (add source ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}) or grab this APK directly." \
            --latest
          # Keep the five newest auto builds (v<a>.<b>.<c>.<code>); hand-made
          # releases are never touched.
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$"))]
                  | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
          | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
